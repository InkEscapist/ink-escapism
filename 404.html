<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ink Escapism — Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111111;
    color: #f0ece4;
    font-family: 'Inter', sans-serif;
    text-align: center;
    padding: 24px;
  }

  .logo-wrap {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    overflow: hidden;
    margin: 0 auto 32px;
    animation: pulse 2.4s ease-in-out infinite;
    box-shadow: 0 0 0 0 rgba(240, 236, 228, 0.3);
  }

  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  @keyframes pulse {
    0%   { opacity: 1;   box-shadow: 0 0 0 0 rgba(240,236,228,0.25); }
    50%  { opacity: 0.55; box-shadow: 0 0 0 18px rgba(240,236,228,0); }
    100% { opacity: 1;   box-shadow: 0 0 0 0 rgba(240,236,228,0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .logo-wrap { animation: none; opacity: 1; }
  }

  .site-name {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.4rem, 5vw, 2rem);
    font-weight: 600;
    letter-spacing: 0.06em;
    color: #f0ece4;
    margin-bottom: 12px;
  }

  .sorry {
    font-size: 0.95rem;
    font-weight: 300;
    color: #9ca3af;
    letter-spacing: 0.02em;
    line-height: 1.7;
  }

  .dots {
    display: inline-flex;
    gap: 5px;
    margin-left: 4px;
    vertical-align: middle;
  }

  .dots span {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #9ca3af;
    animation: blink 1.4s ease-in-out infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; transform: scale(1); }
    40%            { opacity: 1;   transform: scale(1.3); }
  }
</style>
</head>
<body>
  <div class="logo-wrap">
    <img src="https://inkescapist.github.io/ink-escapism/header-art.jpg" alt="Ink Escapism" />
  </div>
  <div class="site-name">Ink Escapism</div>
  <p class="sorry">
    Sorry for the delay — Ink Escapism is loading
    <span class="dots">
      <span></span><span></span><span></span>
    </span>
  </p>
</body>
</html>
